<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6efe7" />
  <meta name="description" content="Маленькое место для нас на время поездки." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>мы</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css?v=20261009-editor3" />
</head>
<body>
  <main class="scene" id="scene">
    <header class="scene-top">
      <div class="scene-context">
        <span id="sceneDate">10—17 октября</span>
        <strong id="sceneStatus">Рыбинск → Курган</strong>
      </div>
      <button class="connect-button" id="connectButton" type="button" aria-label="Подключить приложение"><span class="bi-icon bi-house-heart-fill" aria-hidden="true"></span></button>
      <button class="heart" id="quickHug" type="button" aria-label="Обнять"><span class="bi-icon bi-heart-fill" aria-hidden="true"></span></button>
      <button class="qa-button" id="qaButton" type="button" hidden>QA</button>
    </header>

    <div class="home-crew"><span class="bi-icon bi-house-heart-fill" aria-hidden="true"></span><span>Дома ждём <strong>я и коты</strong></span><span class="crew-dot" aria-hidden="true"></span></div>

    <section class="scene-main" id="sceneMain" aria-live="polite">
      <div class="media" id="media" hidden></div>

      <div class="copy">
        <p class="kicker" id="kicker">до поездки</p>
        <h1 id="title">Пока ты ещё дома</h1>
        <p class="text" id="text"></p>
        <p class="qa-prompt" id="qaPrompt" hidden></p>
      </div>

      <div class="action" id="action"></div>
      <button class="new-moment" id="newMoment" type="button" hidden>Для тебя новая записка <span class="bi-icon bi-arrow-right" aria-hidden="true"></span></button>
      <nav class="moment-nav" id="momentNav" aria-label="Открытые записки" hidden>
        <button id="prevMoment" type="button" aria-label="Предыдущая записка"><span class="bi-icon bi-arrow-right back-arrow" aria-hidden="true"></span></button>
        <span id="momentPosition"></span>
        <button id="nextMoment" type="button" aria-label="Следующая записка"><span class="bi-icon bi-arrow-right" aria-hidden="true"></span></button>
        <button id="homeConfirm" type="button" hidden>Я дома</button>
      </nav>
    </section>

    <footer class="scene-bottom">
      <div class="journey-progress" aria-hidden="true"><span id="journeyProgress"></span></div>
      <div class="next" id="next">
        <span id="nextLabel">до начала поездки</span>
        <strong id="nextValue">—</strong>
      </div>
      <div class="route-mini" id="routeMini" aria-label="Текущий путь">
        <span id="routeFrom">Рыбинск</span>
        <i></i>
        <span id="routeTo">Курган</span>
      </div>
    </footer>
  </main>

  <dialog class="qa-sheet" id="qaSheet">
    <button class="qa-close" id="qaClose" type="button" aria-label="Закрыть"><span class="bi-icon bi-x-lg" aria-hidden="true"></span></button>
    <div class="qa-content" id="qaContent"></div>
  </dialog>

  <dialog class="photo-viewer" id="photoViewer"><button id="closePhoto" type="button" aria-label="Закрыть фотографию"><span class="bi-icon bi-x-lg" aria-hidden="true"></span></button><img id="fullPhoto" alt="" /></dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog id="connectSheet" class="connect-sheet"><button id="connectClose" type="button" aria-label="Закрыть">×</button><h2>Наше место</h2><form id="connectForm"><label for="accessCode">Код доступа</label><input id="accessCode" autocomplete="off" type="password" required /><button class="primary" type="submit">Подключить</button><p id="connectError" role="status"></p></form></dialog>
  <main id="husbandDashboard" class="husband-dashboard" hidden><header><div><p>НАШЕ МЕСТО</p><h1>Её поездка</h1><small id="dashboardStatus"></small></div><button id="dashboardRefresh" type="button">Обновить</button><button id="dashboardLogout" type="button">Выйти</button></header><p id="dashboardEmpty">Здесь появятся её первые отметки.</p><section id="messageComposer"></section><section id="sentMessages"></section><h2>Сейчас</h2><section id="dashboardState"></section><h2>Последние действия</h2><section id="dashboardEvents"></section></main>
  <script src="./sync.js?v=20261009-editor3" defer></script>
  <script src="./content.js?v=20261009-editor3"></script>
  <script src="./messages.js?v=20261009-editor3" defer></script>
  <script src="./app.js?v=20261009-editor3" defer></script>
</body>
</html>
