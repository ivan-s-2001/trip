name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "index.html"
      - "styles.css"
      - "app.js"
      - "content.js"
      - "sw.js"
      - "manifest.webmanifest"
      - "assets/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Trip-1.8.1.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trip-Android-1.8.1
          path: dist/Trip-1.8.1.apk

      - name: Publish rolling Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f android-latest "$GITHUB_SHA"
          git push -f origin android-latest
          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest --title "Trip Android" --notes "Актуальная Android-сборка Trip: offline fallback внутри APK, geofence-переходы, локальные уведомления и один экран поездки."
          else
            gh release create android-latest --title "Trip Android" --notes "Актуальная Android-сборка Trip: offline fallback внутри APK, geofence-переходы, локальные уведомления и один экран поездки."
          fi
          gh release upload android-latest dist/Trip-1.8.1.apk --clobber
