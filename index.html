<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6efe7" />
  <meta name="description" content="Маленькое место для нас на время поездки." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>мы</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <strong>мы</strong>
        <span>10—17 октября</span>
      </div>
      <div class="top-actions">
        <button class="qa-button" id="qaButton" type="button" hidden>QA</button>
        <button class="route-chip" id="routeChip" type="button">
          <span id="routeDot">→</span>
          <span id="routeShort">Рыбинск → Курган</span>
        </button>
      </div>
    </header>

    <main class="today" id="today">
      <section class="day-head">
        <div>
          <p class="eyebrow" id="dayEyebrow">до поездки</p>
          <h1 id="dayTitle">Пока ты ещё дома</h1>
        </div>
        <div class="day-meta">
          <strong id="momentCounter">—</strong>
          <span id="nextKnown">10 октября</span>
        </div>
      </section>

      <section class="moment-card" id="momentCard" aria-live="polite">
        <div class="moment-top">
          <span class="moment-type" id="momentType">для тебя</span>
          <time id="momentTime"></time>
        </div>

        <div class="moment-media" id="momentMedia" hidden></div>

        <div class="moment-copy">
          <h2 id="momentTitle">Здесь будет первый момент</h2>
          <p class="moment-text" id="momentText"></p>
          <p class="moment-prompt" id="momentPrompt" hidden></p>
        </div>

        <div class="moment-action" id="momentAction"></div>
      </section>

      <div class="moment-nav" id="momentNav" hidden>
        <button id="prevMoment" type="button" aria-label="Предыдущий момент">‹</button>
        <div class="moment-dots" id="momentDots" aria-label="Моменты дня"></div>
        <button id="nextMoment" type="button" aria-label="Следующий момент">›</button>
      </div>

      <section class="before-card" id="beforeCard">
        <span>до начала поездки</span>
        <strong id="beforeCountdown">—</strong>
        <p>Само приложение начнёт жить по дням 10 октября.</p>
      </section>
    </main>

    <footer class="dock">
      <button class="dock-button hug-dock" id="globalHugButton" type="button">
        <span class="dock-heart" id="dockHeart">♥</span>
        <span><strong>обнять</strong><small>удерживай</small></span>
      </button>
      <button class="dock-button" id="archiveButton" type="button">
        <span class="dock-icon">◌</span>
        <span><strong>мы</strong><small>фото · письма · голос</small></span>
      </button>
      <button class="dock-button" id="routeButton" type="button">
        <span class="dock-icon">→</span>
        <span><strong>путь</strong><small id="routeDockMeta">через Москву и Тюмень</small></span>
      </button>
    </footer>
  </div>

  <dialog class="sheet" id="sheet">
    <button class="sheet-close" id="sheetClose" type="button" aria-label="Закрыть">×</button>
    <div class="sheet-content" id="sheetContent"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./content.js"></script>
  <script src="./app.js" defer></script>
</body>
</html>
