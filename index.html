<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6efe7" />
  <meta name="description" content="Маленькое место для нас на время поездки." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>мы</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell" id="appShell">
    <header class="topbar">
      <div class="brand">
        <strong>мы</strong>
        <span id="topDate">10—17 октября</span>
      </div>
      <button class="qa-button" id="qaButton" type="button" hidden>QA</button>
    </header>

    <main class="one-screen">
      <section class="journey" id="journey" aria-live="polite">
        <div class="journey-copy">
          <span class="journey-kicker" id="journeyKicker">поездка</span>
          <strong id="journeyTitle">Рыбинск → Курган</strong>
          <small id="journeyMeta">через Москву и Тюмень</small>
        </div>
        <div class="journey-line" aria-hidden="true">
          <span id="journeyProgress"></span>
        </div>
        <div class="journey-points" id="journeyPoints" aria-hidden="true"></div>
      </section>

      <section class="moment-card" id="momentCard" aria-live="polite">
        <div class="moment-meta">
          <span id="momentKind">для тебя</span>
          <span id="momentPosition">1 / 8</span>
          <time id="momentTime"></time>
        </div>

        <div class="moment-media" id="momentMedia" hidden></div>

        <div class="moment-copy" id="momentCopy">
          <p class="moment-day" id="momentDay">10 октября</p>
          <h1 id="momentTitle">Перед дорогой</h1>
          <p id="momentText"></p>
          <p class="qa-prompt" id="qaPrompt" hidden></p>
        </div>

        <div class="moment-action" id="momentAction"></div>
      </section>

      <div class="swipe-hint" id="swipeHint" hidden>
        <span>‹</span><small>свайп между открытыми моментами</small><span>›</span>
      </div>
    </main>

    <footer class="footer-state">
      <div>
        <span id="footerKicker">до начала поездки</span>
        <strong id="footerValue">—</strong>
      </div>
      <button class="heart-button" id="globalHugButton" type="button" aria-label="Обнять">
        <span class="heart-progress" id="heartProgress">♥</span>
        <small>удерживай</small>
      </button>
    </footer>
  </div>

  <dialog class="qa-sheet" id="qaSheet">
    <button class="qa-close" id="qaClose" type="button">×</button>
    <div class="qa-content" id="qaContent"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./content.js"></script>
  <script src="./app.js" defer></script>
</body>
</html>
