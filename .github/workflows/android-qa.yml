name: Build Vanya Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "index.html"
      - "styles.css"
      - "app.js"
      - "sync.js"
      - "messages.js"
      - "content.js"
      - "moments.json"
      - "sw.js"
      - "manifest.webmanifest"
      - "assets/**"
      - ".github/workflows/android-qa.yml"

permissions:
  contents: write

concurrency:
  group: android-husband-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-husband:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check web syntax
        run: |
          node --check app.js
          node --check content.js

      - name: Build Vanya APK
        run: gradle -p android :app:assembleHusband --stacktrace

      - name: Prepare Vanya APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/husband/app-husband.apk dist/Trip-Vanya-2.3.1.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trip-Vanya-2.3.1
          path: dist/Trip-Vanya-2.3.1.apk

      - name: Publish husband release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f husband-latest "$GITHUB_SHA"
          git push -f origin husband-latest
          if gh release view husband-latest >/dev/null 2>&1; then
            gh release edit husband-latest --title "Trip · Ваня" --notes "Приложение Вани: редактор сообщений, расписание и ответы Наташи."
          else
            gh release create husband-latest --title "Trip · Ваня" --notes "Приложение Вани: редактор сообщений, расписание и ответы Наташи."
          fi
          gh release upload husband-latest dist/Trip-Vanya-2.3.1.apk --clobber
